<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Proposed Morrow bounded context graph</title>
  <desc id="desc">Canonical business modules emit a rebuildable node and edge projection into D1 and optional embeddings into Vectorize. An authorized context lens resolves a seed, traverses selected typed edges within budgets, hydrates current module projections, and returns a cited context envelope to an agent.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#5d6965"/>
    </marker>
    <marker id="arrow-light" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c6d0c9"/>
    </marker>
    <style>
      .title { font: 700 40px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17211f; letter-spacing: -1.4px; }
      .subtitle { font: 400 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5d6965; }
      .eyebrow { font: 700 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #8d3121; letter-spacing: 1.5px; }
      .section { font: 700 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17211f; }
      .label { font: 700 15px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17211f; }
      .small { font: 400 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5d6965; }
      .panel { fill: #fffdfa; stroke: #d7dbd2; stroke-width: 1.5; }
      .soft { fill: #dce5d6; stroke: #c6d1bf; stroke-width: 1.5; }
      .sand { fill: #eee4d8; stroke: #d9ccbd; stroke-width: 1.5; }
      .dark { fill: #17211f; stroke: #17211f; stroke-width: 1.5; }
      .inverse { fill: #fffdfa; }
      .inverse-muted { fill: #c6d0c9; }
      .line { fill: none; stroke: #5d6965; stroke-width: 2; marker-end: url(#arrow); }
      .line-dark { fill: none; stroke: #c6d0c9; stroke-width: 2; marker-end: url(#arrow-light); }
      .dash { fill: none; stroke: #8d9892; stroke-width: 1.5; stroke-dasharray: 6 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="800" fill="#f6f4ee"/>
  <text class="eyebrow" x="60" y="54">PROPOSED · NOT YET IMPLEMENTED</text>
  <text class="title" x="60" y="100">Bounded context graph on Cloudflare</text>
  <text class="subtitle" x="60" y="132">A rebuildable retrieval projection—not a second source of business truth.</text>

  <rect class="panel" x="60" y="176" width="280" height="172" rx="16"/>
  <text class="section" x="86" y="211">Canonical modules</text>
  <text class="small" x="86" y="235">Communications</text>
  <text class="small" x="86" y="257">Helpdesk · cases + public knowledge</text>
  <text class="small" x="86" y="279">Directory · CRM · Operations</text>
  <text class="small" x="86" y="301">Improvement</text>
  <text class="small" x="86" y="323">Own policy, revisions, audit, and truth.</text>

  <path class="line" d="M340 245 H408"/>
  <text class="small" x="374" y="232" text-anchor="middle">outbox / queue</text>
  <rect class="soft" x="416" y="176" width="310" height="172" rx="16"/>
  <text class="section" x="442" y="211">Projection compiler</text>
  <text class="small" x="442" y="241">Typed nodes and edges</text>
  <text class="small" x="442" y="265">Module revision + provenance</text>
  <text class="small" x="442" y="289">Visibility + freshness</text>
  <text class="small" x="442" y="323">Idempotent and fully rebuildable.</text>

  <path class="line" d="M726 222 H794"/>
  <path class="dash" d="M726 302 H794"/>
  <rect class="panel" x="802" y="176" width="242" height="76" rx="14"/>
  <text class="label" x="923" y="207" text-anchor="middle">D1 graph projection</text>
  <text class="small" x="923" y="229" text-anchor="middle">nodes · typed edges · cursors</text>
  <rect class="panel" x="802" y="272" width="242" height="76" rx="14"/>
  <text class="label" x="923" y="303" text-anchor="middle">Vectorize</text>
  <text class="small" x="923" y="325" text-anchor="middle">optional semantic seed discovery</text>

  <rect class="sand" x="1080" y="176" width="260" height="172" rx="16"/>
  <text class="section" x="1106" y="211">Evidence stores</text>
  <text class="small" x="1106" y="241">Private R2 originals</text>
  <text class="small" x="1106" y="265">Public knowledge documents</text>
  <text class="small" x="1106" y="289">Bounded derived summaries</text>
  <text class="small" x="1106" y="323">Content remains evidence, never instructions.</text>

  <path class="dash" d="M1080 303 H1052"/>

  <rect class="dark" x="60" y="414" width="1280" height="254" rx="20"/>
  <text class="eyebrow inverse-muted" x="86" y="452">ONE READ-ONLY CONTEXT INTERFACE</text>

  <rect x="86" y="478" width="190" height="118" rx="12" fill="#263330" stroke="#4e5d58"/>
  <text class="label inverse" x="181" y="509" text-anchor="middle">1 · Authorize</text>
  <text class="small inverse-muted" x="181" y="536" text-anchor="middle">actor · deployment</text>
  <text class="small inverse-muted" x="181" y="557" text-anchor="middle">visibility boundary</text>
  <path class="line-dark" d="M276 537 H316"/>

  <rect x="324" y="478" width="190" height="118" rx="12" fill="#263330" stroke="#4e5d58"/>
  <text class="label inverse" x="419" y="509" text-anchor="middle">2 · Resolve seed</text>
  <text class="small inverse-muted" x="419" y="536" text-anchor="middle">exact identity first</text>
  <text class="small inverse-muted" x="419" y="557" text-anchor="middle">semantic fallback</text>
  <path class="line-dark" d="M514 537 H554"/>

  <rect x="562" y="478" width="190" height="118" rx="12" fill="#263330" stroke="#4e5d58"/>
  <text class="label inverse" x="657" y="509" text-anchor="middle">3 · Traverse lens</text>
  <text class="small inverse-muted" x="657" y="536" text-anchor="middle">edge allowlist · direction</text>
  <text class="small inverse-muted" x="657" y="557" text-anchor="middle">depth · node budget</text>
  <path class="line-dark" d="M752 537 H792"/>

  <rect x="800" y="478" width="190" height="118" rx="12" fill="#263330" stroke="#4e5d58"/>
  <text class="label inverse" x="895" y="509" text-anchor="middle">4 · Hydrate</text>
  <text class="small inverse-muted" x="895" y="536" text-anchor="middle">current public module views</text>
  <text class="small inverse-muted" x="895" y="557" text-anchor="middle">revision · unknowns</text>
  <path class="line-dark" d="M990 537 H1030"/>

  <rect x="1038" y="478" width="276" height="118" rx="12" fill="#263330" stroke="#4e5d58"/>
  <text class="label inverse" x="1176" y="509" text-anchor="middle">5 · Pack context envelope</text>
  <text class="small inverse-muted" x="1176" y="536" text-anchor="middle">facts · relationships · evidence</text>
  <text class="small inverse-muted" x="1176" y="557" text-anchor="middle">freshness · citations · next actions</text>

  <text class="small inverse-muted" x="700" y="638" text-anchor="middle">Every lens has a token ceiling and returns explicit truncation and unresolved facts.</text>

  <path class="line" d="M1176 668 V710"/>
  <rect class="soft" x="994" y="710" width="346" height="58" rx="12"/>
  <text class="label" x="1167" y="735" text-anchor="middle">Agent receives useful context, not a graph dump</text>
  <text class="small" x="1167" y="755" text-anchor="middle">via one task-shaped MCP tool or resource</text>

  <text class="subtitle" x="60" y="746">Graph deletion loses no business truth.</text>
  <text class="small" x="60" y="770">Rebuild from module-owned state and recorded projection cursors.</text>
</svg>
